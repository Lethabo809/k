<!DOCTYPE html>
<html>
<head>
    <title>Lab 2 – Basic CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Heading (ID selector) -->
    <h1 id="main-title">My Awesome Website</h1>

    <!-- Normal Paragraphs (Element selector) -->
    <p>This is the first paragraph on the page.</p>
    <p>This is the second paragraph, just normal text.</p>

    <!-- Highlighted Paragraph (Class selector) -->
    <p class="highlight">This paragraph is important and stands out.</p>

    <!-- Another Normal Paragraph -->
    <p>Another normal paragraph to see the difference.</p>

</body>
</html>
